[package]
name = "markspace"
version = "1.30.1"
description = "Markdown-first local vault with Notion-like editing"
authors = ["you"]
edition = "2021"
default-run = "markspace"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "markspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "markspace-embeddings"
path = "src/bin/markspace_embeddings.rs"
required-features = ["embeddings-sidecar"]

[features]
# Candle/tokenizers only for the embeddings process — keeps the main app (and MSI) small.
default = []
embeddings-sidecar = [
  "dep:candle-core",
  "dep:candle-nn",
  "dep:candle-transformers",
  "dep:tokenizers",
]

[profile.release]
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-store = "2.4.4"
notify = "6"
walkdir = "2.5.0"
tauri-plugin-process = "2"
base64 = "0.22"
tauri-plugin-clipboard-manager = "2.3.2"
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
sha2 = "0.11.0"
anyhow = "1"
bincode = "1"
candle-core = { version = "0.8.4", optional = true }
candle-nn = { version = "0.8.4", optional = true }
candle-transformers = { version = "0.8.4", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
parking_lot = "0.12"
pdf-extract = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
rmcp = { version = "3", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }
http = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
webkit2gtk = "2.0"

