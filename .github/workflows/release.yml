name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.args }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --max-old-space-size=8192
        with:
          tagName: v__VERSION__
          releaseName: MarkSpace v__VERSION__
          releaseBody: |
            See the assets below to download and install MarkSpace.

            Windows: prefer the installer (`.msi` / setup `.exe`).
            `MarkSpace_*_x64-portable.zip` is a portable build (requires WebView2; no auto-update).
            macOS: `.dmg` for Apple Silicon (`aarch64`) or Intel (`x86_64`). Unsigned builds may need System Settings → Privacy & Security → Open Anyway.
          releaseDraft: false
          prerelease: false
          # Matrix legs must not touch latest.json — parallel upload races and
          # last-writer-wins leave Windows/macOS out of the updater manifest.
          # A dedicated publish-updater job writes it once after all builds.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Upload Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/release/markspace.exe"
          if (-not (Test-Path $exe)) {
            throw "Portable build failed: missing $exe"
          }

          $stage = Join-Path $env:RUNNER_TEMP "markspace-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "MarkSpace.exe") -Force

          $zipName = "MarkSpace_${version}_x64-portable.zip"
          $zipPath = Join-Path $PWD $zipName
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stage "MarkSpace.exe") -DestinationPath $zipPath

          $tag = "v$version"
          gh release upload $tag $zipPath --clobber

  # Single writer for the Tauri updater manifest. Runs after every matrix leg
  # so all .sig files are on the release; fails if a required platform is missing.
  publish-updater:
    needs: publish-tauri
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            # workflow_dispatch without a tag — use version from tauri.conf.json
            TAG="v$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          fi
          OUT="${RUNNER_TEMP}/latest.json"
          python3 .github/scripts/build-updater-latest-json.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "$TAG" \
            --out "$OUT"
          gh release upload "$TAG" "$OUT" --clobber
          echo "Uploaded complete updater manifest for $TAG"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("platforms:", ", ".join(sorted(d["platforms"])))' "$OUT"
